name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you'd like.
      placeholder: "It would be great if Commit+ could..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What pain point or workflow issue does this address?
      placeholder: "Currently I have to..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought of.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Commit+ would this affect?
      options:
        - Repository view
        - Commits / History
        - Branches
        - Staging / Diff
        - Conflict resolution
        - Worktree
        - Git Flow
        - AI commit generation
        - Terminal CLI
        - Settings / Preferences
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or anything else that helps.
    validations:
      required: false
